name: "Build"

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:12
        env:
          POSTGRES_DB: whatsthecharge_test
          POSTGRES_PASSWORD: hunter2
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:hunter2@localhost:5432/whatsthecharge_test

    steps:
      - uses: actions/checkout@v2

      - name: Read .tool-versions
        run: >
         echo ::set-output
         name=node::$(cat .tool-versions | grep nodejs | cut -d ' ' -f 2)
         name=ruby::$(cat .tool-versions | grep ruby | cut -d ' ' -f 2)
        id: tool-versions

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '${{ steps.tool-versions.outputs.ruby }}'

      - uses: actions/setup-node@v1
        with:
          node-version: '${{ steps.tool-versions.outputs.node }}'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "::set-output name=dir::$(yarn cache dir)"

      - uses: actions/cache@v2
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - uses: actions/cache@v2
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Run bundle install
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run rails assets:precompile
        run: bundle exec rails assets:precompile

      - name: Run rails db:migrate
        run: bundle exec rails db:migrate

      - name: Run rails test
        run: bundle exec rails test
